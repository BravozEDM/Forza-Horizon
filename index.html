<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reto Goliath 85.4 km — Tabla Oficial | Bravoz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0b0d13;
      --bg-card: rgba(18, 22, 33, 0.92);
      --bg-row: rgba(255, 255, 255, 0.03);
      --bg-row-hover: rgba(255, 255, 255, 0.07);
      --border-subtle: rgba(255, 255, 255, 0.09);
      --accent-primary: #ff2a6d;
      --accent-secondary: #05d9e8;
      --gold: #ffd700;
      --silver: #d1d5db;
      --bronze: #cd7f32;
      --win: #10b981;
      --loss: #f43f5e;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      background-image:
        radial-gradient(circle at 15% 15%, rgba(255, 42, 109, 0.14), transparent 38%),
        radial-gradient(circle at 85% 80%, rgba(5, 217, 232, 0.12), transparent 40%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 28px 16px 60px;
    }

    body.obs-mode {
      background: transparent !important;
      padding: 12px;
    }

    body.obs-mode .hide-in-obs {
      display: none !important;
    }

    body.obs-mode .board-container {
      background: rgba(11, 13, 19, 0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(5, 217, 232, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    }

    .wrapper {
      max-width: 1050px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-subtle);
      padding-bottom: 18px;
    }

    .title-group .tag {
      display: inline-block;
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-secondary);
      background: rgba(5, 217, 232, 0.12);
      border: 1px solid rgba(5, 217, 232, 0.3);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .title-group h1 {
      font-family: 'Chakra Petch', sans-serif;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      line-height: 1.05;
    }

    .title-group h1 span {
      color: var(--accent-primary);
    }

    .title-group p {
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-top: 6px;
    }

    .game-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab-btn {
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      text-transform: uppercase;
      padding: 9px 16px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: var(--accent-secondary);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent-primary), #c9184a);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 16px rgba(255, 42, 109, 0.35);
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .stat-card .label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-card .value.highlight {
      color: var(--gold);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .search-box {
      flex: 1;
      min-width: 220px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--accent-secondary);
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-small {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 9px 13px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-small:hover, .btn-small.active {
      border-color: var(--accent-secondary);
      background: rgba(5, 217, 232, 0.14);
    }

    .board-container {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow-x: auto;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      min-width: 650px;
    }

    thead th {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(0, 0, 0, 0.25);
    }

    tbody tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: var(--bg-row);
      transition: background 0.15s ease;
    }

    tbody tr:hover {
      background: var(--bg-row-hover);
    }
